<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Module planner (unofficial)</title>
    <meta name="robots" content="noindex" />
    <meta name="description" content="Unofficial student planner for Imperial MSc Advanced Computing module choices: your week, clashes, exam/coursework splits, class averages and reviews in one place. Not affiliated with Imperial." />
    <meta property="og:title" content="Module planner (unofficial)" />
    <meta property="og:description" content="Plan your MSc Advanced Computing modules: timetable, clashes, assessment split, averages and reviews. Unofficial student project." />
    <meta property="og:type" content="website" />
    <script>
      // Apply the theme before first paint (no flash). Keep in sync with src/hooks/use-theme.ts.
      try {
        var t = localStorage.getItem("module-planner:theme")
        var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.classList.toggle("dark", dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
